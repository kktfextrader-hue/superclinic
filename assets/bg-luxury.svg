<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <pattern id="luxury" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse">
      <!-- Center mandala -->
      <g transform="translate(80,80)" fill="none" stroke="#C8A96B" stroke-width="0.7" opacity="0.55">
        <!-- 8-petal lotus -->
        <g>
          <ellipse cx="0" cy="-22" rx="6" ry="14"/>
          <ellipse cx="0" cy="22" rx="6" ry="14"/>
          <ellipse cx="-22" cy="0" rx="14" ry="6"/>
          <ellipse cx="22" cy="0" rx="14" ry="6"/>
          <g transform="rotate(45)">
            <ellipse cx="0" cy="-22" rx="5" ry="11"/>
            <ellipse cx="0" cy="22" rx="5" ry="11"/>
            <ellipse cx="-22" cy="0" rx="11" ry="5"/>
            <ellipse cx="22" cy="0" rx="11" ry="5"/>
          </g>
        </g>
        <!-- Outer ring -->
        <circle cx="0" cy="0" r="35" stroke-dasharray="2 3" opacity="0.6"/>
        <!-- Center dot -->
        <circle cx="0" cy="0" r="3" fill="#C8A96B" stroke="none" opacity="0.8"/>
      </g>
      <!-- Corner ornaments -->
      <g fill="#C8A96B" opacity="0.35">
        <circle cx="0" cy="0" r="1.2"/>
        <circle cx="160" cy="0" r="1.2"/>
        <circle cx="0" cy="160" r="1.2"/>
        <circle cx="160" cy="160" r="1.2"/>
      </g>
      <!-- Mid-edge dots forming a frame -->
      <g fill="#C8A96B" opacity="0.4">
        <circle cx="80" cy="10" r="1.4"/>
        <circle cx="80" cy="150" r="1.4"/>
        <circle cx="10" cy="80" r="1.4"/>
        <circle cx="150" cy="80" r="1.4"/>
      </g>
      <!-- Diagonal accent lines (very subtle) -->
      <g stroke="#C8A96B" stroke-width="0.3" opacity="0.18">
        <line x1="0" y1="40" x2="40" y2="0"/>
        <line x1="120" y1="160" x2="160" y2="120"/>
        <line x1="160" y1="40" x2="120" y2="0"/>
        <line x1="40" y1="160" x2="0" y2="120"/>
      </g>
    </pattern>
  </defs>
  <rect width="160" height="160" fill="url(#luxury)"/>
</svg>
